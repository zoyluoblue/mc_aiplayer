name: Nightly deterministic runtime matrix

on:
  schedule:
    # 02:17 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      mining_acceptance:
        description: Explicit long Mining First tier; never runs on schedule or PR
        required: true
        type: choice
        default: none
        options: [none, prepared, from_zero]

permissions:
  contents: read

concurrency:
  group: nightly-deterministic
  cancel-in-progress: false

jobs:
  deterministic-runtime:
    name: ${{ matrix.profile }} @ seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [strict_survival, operator]
        seed: [20260610, 3000]

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check CI invariants
        run: bash scripts/ci_static_check.sh

      - name: Run unit tests, GameTests and production build
        run: ./gradlew --no-daemon --console=plain --stacktrace clean test runGameTest build

      - name: Run immutable profile/runtime and Mining First contract evidence batch
        env:
          PROFILE: ${{ matrix.profile }}
          TEST_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          args=(
            --scenario capability_profile+runtime_control_suite+mining_contract_suite
            --seeds "$TEST_SEED"
            --runs 1
            --timeout 300
            --startup-timeout 480
            --profile "$PROFILE"
          )
          [[ "$PROFILE" != operator ]] || args+=(--operator-capabilities all)
          bash scripts/evidence_batch.sh "${args[@]}"

      - name: Upload nightly diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.profile }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/evidence/**
            artifacts/evidence-batches/**
            build/reports/tests/**
            build/test-results/**
            build/run/gameTest/logs/**
            build/run/gameTest/crash-reports/**

  prepared-mining-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mining_acceptance == 'prepared' }}
    name: Mining First prepared diagnostics / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [diamond, obsidian]

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check CI invariants
        run: bash scripts/ci_static_check.sh

      - name: Run explicit strict-survival Mining First evidence
        run: bash scripts/mining_acceptance.sh prepared "${{ matrix.target }}"

      - name: Upload long Mining First evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mining-prepared-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/evidence/**
            artifacts/evidence-batches/**
            build/reports/tests/**
            build/test-results/**
            build/run/evidence-*/logs/**
            build/run/evidence-*/crash-reports/**

  prepare_mining_shards:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mining_acceptance == 'from_zero' }}
    name: Prepare canonical Mining First shard matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and publish the fixed 58-shard matrix
        id: matrix
        run: |
          set -euo pipefail
          bash scripts/mining_evidence_shard.sh --self-test
          matrix="$(bash scripts/mining_evidence_shard.sh --matrix-json)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  mining_from_zero_shard:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mining_acceptance == 'from_zero' }}
    needs: prepare_mining_shards
    name: Mining shard / ${{ matrix.target }} / ${{ matrix.role }} / ${{ matrix.seed }} / r${{ matrix.run_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare_mining_shards.outputs.matrix) }}

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check CI and shard invariants
        run: bash scripts/ci_static_check.sh

      - name: Run one sealed strict-survival from-zero shard
        run: >-
          bash scripts/mining_evidence_shard.sh
          "${{ matrix.target }}"
          "${{ matrix.role }}"
          "${{ matrix.seed }}"
          "${{ matrix.run_index }}"

      - name: Upload the sealed shard descriptor and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mining-shard-${{ matrix.target }}-${{ matrix.role }}-${{ matrix.seed }}-r${{ matrix.run_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/evidence/**
            artifacts/mining-shards/**

  mining_from_zero_aggregate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mining_acceptance == 'from_zero' && needs.prepare_mining_shards.result == 'success' }}
    needs: [prepare_mining_shards, mining_from_zero_shard]
    name: Mining multi-seed gate / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [diamond, obsidian]

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download only this target's explicit shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mining-shard-${{ matrix.target }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          merge-multiple: true

      - name: Revalidate every shard and assemble canonical batches
        run: bash scripts/mining_evidence_aggregate.sh "${{ matrix.target }}"

      - name: Upload canonical batches and their exact dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mining-multi-seed-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/evidence/**
            artifacts/evidence-batches/**
            artifacts/mining-shards/**
